<!-- 启动画面内联样式：不依赖外部 CSS，页面一打开就能看到，不会先黑屏 -->
<style>
  #boot{
    position:fixed;inset:0;z-index:9999;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    background:
      radial-gradient(ellipse at 50% 36%, #2a303c 0%, #141821 46%, #07080b 100%);
    color:#e3d6b8;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    transition:opacity .32s ease;opacity:1;
  }
  #boot.boot-out{opacity:0;pointer-events:none;}
  #boot .boot-logo{font-size:34px;letter-spacing:10px;font-weight:600;color:#d8b978;text-indent:10px;}
  #boot .boot-sub{font-size:15px;letter-spacing:6px;color:#8d8574;}
  #boot .boot-bar{width:150px;height:3px;border-radius:2px;background:rgba(201,162,95,.18);overflow:hidden;margin-top:8px;}
  #boot .boot-bar i{display:block;width:42%;height:100%;border-radius:2px;background:#c9a25f;animation:boot-slide 1.1s ease-in-out infinite;}
  #boot .boot-tip{font-size:13px;color:#6f6a5e;letter-spacing:2px;}
  @keyframes boot-slide{0%{transform:translateX(-110%)}100%{transform:translateX(260%)}}
</style>
<!--
  样式模块（一个界面一个文件，互不覆盖；顺序不可调整）：

    ui-kit     → 公用 UI 套件（公共弹框 / 内容底 / 输入框 / 按钮 / 勾选）
    login      → 登录弹窗（保留黑色遮罩）
    entry      → 入场确认页（原画直出，不压暗）
    character  → 选角
    town       → 主城
    combat-bar → 主城 / 副本共用底栏、摇杆、图标反馈与特效
    panels     → 通用弹窗与功能面板
    battle     → 副本战斗 HUD
    adapt      → 移动端放大，永远最后
  修改规则：只改对应界面文件；共用件只放 base / panels / combat-bar。
-->

  <div id="stage">

  </div>

<!--
  模块分层（依赖只能自上向下，禁止反向引用）：

    art    → 纯绘制资源（矢量角色 / 怪物 / 首领 / 地形道具），不引用 core、ui
    core   → 通用能力：存档、设置、角色成长、属性、掉落
    ui     → 通用弹窗 / 各功能面板，只读写 DG.data、DG.core
    scenes → 场景表现，组合 core 与 ui；不直接被 core 引用
    game   → 入口与场景切换，唯一持有运行期全局状态的模块
  新增功能：先确定所属层，再在对应目录新建独立文件，并在下方按依赖顺序挂载。
  修改规则：只改所属层文件；跨层调用单向向下，禁止下层反向引用上层。
-->
