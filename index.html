/* ============================================================
   公用 UI 套件（ui-kit）
   ------------------------------------------------------------
   资源来源：F:\暗黑\登录弹框资源

/* ==== css/character.css ==== */
/* 选角界面：三槽位名册 + 角色预览。只改本文件，不影响其它界面。 */

/* ---------- 选角色（竖版三槽位，垂直居中） ---------- */
.char-screen{
  padding:38px 40px 24px;
  overflow:visible;
  background:none;
}
/* 背景层铺满整个舞台（最大 810×1680）：UI 仍固定 720×1440 居中，大屏只外扩背景 */
.char-screen::before{
  content:"";
  position:absolute;
  left:var(--ui-ox,0px);
  top:var(--ui-oy,0px);
  width:var(--stage-w,720px);
  height:var(--stage-h,1440px);
  /* 背景只放插画本身，不加网格 / 压暗叠加 */
  background:url("assets/char-bg.jpg") center top / cover no-repeat,
    radial-gradient(ellipse at 50% 30%, #2a303c 0%, #141a24 50%, #07080b 100%);
  pointer-events:none;
}
/* 选角不放通用网格纹理 */
.char-screen::after{display:none;}

/* ---------- 职业色彩分级：同一张背景图，按职业重新调色 ----------
   野蛮人 = 原色暖褐；游侠 = 紫色系；术士 = 蓝色系。
   g-hue 用 color 混合换色相，g-glow 用 soft-light 提亮石台，
   g-mist 用 screen 叠雾气，g-shade 压回四周暗角保留纵深。 */
.char-screen{
  --grade-top:transparent;
  --grade-mid:transparent;
  --grade-bot:transparent;
  --grade-glow:transparent;
  --grade-mist:transparent;
  --grade-rim:transparent;
  --grade-hue-op:0;
  --grade-glow-op:0;
  --grade-mist-op:0;
  --grade-rim-op:0;
  --grade-shade-op:0;
  --grade-grain-op:0;
}
.char-screen[data-cls="ranger"]{
  --grade-top:#1b0f26;
  --grade-mid:#4a2c74;
  --grade-bot:#150d1f;
  --grade-glow:rgba(178,128,246,.55);
  --grade-mist:rgba(140,96,220,.24);
  --grade-rim:rgba(196,146,255,.6);
  --grade-hue-op:.58;
  --grade-glow-op:.38;
  --grade-mist-op:.2;
  --grade-rim-op:.34;
  --grade-shade-op:.66;
  --grade-grain-op:.16;
}
.char-screen[data-cls="mage"]{
  --grade-top:#081120;
  --grade-mid:#2b5b8f;
  --grade-bot:#07101c;
  --grade-glow:rgba(122,182,255,.55);
  --grade-mist:rgba(86,150,236,.24);
  --grade-rim:rgba(128,190,255,.6);
  --grade-hue-op:.58;
  --grade-glow-op:.38;
  --grade-mist-op:.2;
  --grade-rim-op:.34;
  --grade-shade-op:.66;
  --grade-grain-op:.16;
}
.char-grade{
  position:absolute;
  /* 与背景层同步铺满舞台，避免大屏下四周没有被职业色调分级 */
  left:var(--ui-ox,0px);
  top:var(--ui-oy,0px);
  right:auto;
  bottom:auto;
  width:var(--stage-w,720px);
  height:var(--stage-h,1440px);
  pointer-events:none;
  z-index:1;
}
.char-grade i{position:absolute;inset:0;display:block;}
.char-grade .g-hue{
  background:linear-gradient(180deg,var(--grade-top) 0%,var(--grade-mid) 46%,var(--grade-bot) 100%);
  mix-blend-mode:color;
  opacity:var(--grade-hue-op);
}
.char-grade .g-glow{
  background:radial-gradient(ellipse 54% 26% at 50% 41%,var(--grade-glow) 0%,rgba(0,0,0,0) 70%);
  mix-blend-mode:soft-light;
  opacity:var(--grade-glow-op);
}
.char-grade .g-mist{
  background:
    radial-gradient(ellipse 46% 22% at 26% 28%,var(--grade-mist) 0%,rgba(0,0,0,0) 70%),
    radial-gradient(ellipse 42% 20% at 76% 56%,var(--grade-mist) 0%,rgba(0,0,0,0) 72%),
    radial-gradient(ellipse 52% 24% at 50% 41%,var(--grade-mist) 0%,rgba(0,0,0,0) 74%),
    linear-gradient(180deg,var(--grade-mist) 0%,rgba(0,0,0,0) 30%);
  mix-blend-mode:screen;
  opacity:var(--grade-mist-op);
}
.char-grade .g-rim{
  background:radial-gradient(ellipse 26% 7% at 50% 41%,var(--grade-rim) 0%,rgba(0,0,0,0) 72%);
  mix-blend-mode:screen;
  opacity:var(--grade-rim-op);
}
.char-grade .g-shade{
  background:radial-gradient(ellipse 74% 58% at 50% 42%,rgba(0,0,0,0) 42%,rgba(5,3,10,.72) 100%);
  opacity:var(--grade-shade-op);
}
/* 细颗粒，压掉大面积渐变的色带，增加成片质感 */
.char-grade .g-grain{
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='140' height='140' filter='url(%23n)' opacity='.55'/></svg>");
  background-size:140px 140px;
  mix-blend-mode:overlay;
  opacity:var(--grade-grain-op);
}
.screen-head{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:20px;
  padding-bottom:18px;
  border-bottom:2px solid rgba(220,203,176,.3);

/* 预览区：立绘按舞台坐标锚定，脚底永远落在石台中心，不随屏幕比例 / 字号档位漂移 */

.preview-empty-glyph{

  /* 与石台中心的圆环对齐，压在台面圆圈上 */
  transform:translateY(-28px);

/* 空槽创建按钮：使用公用按钮资源原尺寸 238×98，不压缩 */
.preview-empty .btn{width:238px;height:98px;padding:0;margin-top:6px;font-size:36px;letter-spacing:.5px;}

/* 底部槽位切换（预览层已脱离文档流，这里靠 margin-top 压到底部） */
.char-slots{

.char-foot{

  text-align:center;

}
.class-picks{

}
.class-pick{
  border:1px solid #3a3730;border-radius:4px;
  padding:20px 12px;text-align:center;cursor:pointer;

  transition:border-color .15s, box-shadow .15s, transform .15s, background .15s;

.class-pick:hover{border-color:#8a7448;transform:translateY(-1px);background:rgba(201,162,95,.04);}
.class-pick.sel{

.pick-title{font-size:12px;color:var(--muted);margin-top:4px;}
.cls-desc{font-size:12.5px;color:var(--text-2);margin-top:12px;line-height:1.8;}
.cls-base{color:var(--muted);}


/* ==== css/town.css ==== */

.town-body{

/* ==== css/combat-bar.css ==== */
/* 主城 / 副本共用的底部战斗条、功能图标反馈与图标特效。 */

/* ---------- 底部战斗条（主城 / 副本共用） ---------- */
.combat-bar{
  position:relative;
  height:220px;
  display:flex;align-items:center;justify-content:center;
}
.combat-medal{
  position:absolute;
  /* 圆心对齐技能图标的水平中线（技能框含下方序号，几何中心略低） */
  top:calc(50% - 9px);
  width:200px;height:200px;
  transform:translateY(-50%);
  padding:0;border:0;background:none;cursor:pointer;
  pointer-events:auto;
  z-index:2;
  transition:transform .14s, filter .16s;
}
.combat-medal:first-of-type{left:-31px;}
.combat-medal:last-of-type{right:-31px;}
.combat-medal img{
  display:block;width:100%;height:100%;object-fit:contain;
  filter:drop-shadow(0 6px 14px rgba(0,0,0,.55));
}
/* 尚未配置专属图标的职业：黑金圆盘 + 金色篆字，占位与图标位一致 */
.combat-medal:not(.quest-medal) .medal-glyph{
  display:flex;align-items:center;justify-content:center;
  width:70%;height:70%;margin:15%;
  border-radius:50%;
  border:3px solid var(--gold-dim);
  background:
    radial-gradient(circle at 38% 30%, rgba(201,162,95,.28), rgba(16,13,8,.96) 68%),
    #16120b;
  box-shadow:0 8px 20px rgba(0,0,0,.62), inset 0 0 16px rgba(201,162,95,.18);
  font-size:58px;transform:none;
}
/* 白色文字 + 深色描边，保证在背景上清晰可读 */
.medal-label{
  position:absolute;left:50%;bottom:12px;
  transform:translateX(-50%);
  white-space:nowrap;
  font-size:25px;font-weight:700;letter-spacing:2px;
  color:#fff;line-height:1;
  pointer-events:none;
  z-index:3;
}
.medal-label::before{
  content:attr(data-label);
  position:absolute;left:0;top:0;
  color:#191008;
  -webkit-text-stroke:5px #191008;
  z-index:-1;
}
.combat-medal:hover{transform:translateY(calc(-50% - 2px));filter:brightness(1.08);}
.combat-medal:active{transform:translateY(-50%);}
.combat-medal:focus-visible{outline:2px solid var(--gold-2);outline-offset:2px;border-radius:50%;}

/* ---------- 功能图标点击反馈：按下缩放 + 金色闪光（主城与副本共用） ---------- */
@keyframes tap-press{
  0%{scale:1;filter:brightness(1);}
  30%{scale:.95;filter:brightness(1.3) saturate(1.1);}
  100%{scale:1;filter:brightness(1);}
}
@keyframes tap-glow{
  0%{opacity:0;}
  35%{opacity:.9;}
  100%{opacity:0;}
}
.combat-medal,.town-portal,.town-corner-btn,.strip-slot{
  -webkit-tap-highlight-color:transparent;
}
.combat-medal .medal-label,.town-portal .tp-label{
  transition:scale .18s ease-out;
}
.tap-on{animation:tap-press .34s ease-out;}
.tap-on .medal-label,.tap-on .tp-label{scale:1.08;}
.tap-on::after{
  content:"";position:absolute;inset:0;border-radius:inherit;
  background:radial-gradient(circle at 50% 50%,
    rgba(255,238,196,.5), rgba(255,214,138,.18) 46%, rgba(255,214,138,0) 68%);
  pointer-events:none;
  z-index:3;
  animation:tap-glow .34s ease-out;
}
/* 顶栏设置键是方钮，闪光按圆角矩形裁切 */
.town-corner-btn{position:relative;}
.town-corner-btn.tap-on::after{border-radius:6px;}

/* ---------- 装备 / 技能图标：火星升腾特效（仅 transform / opacity，随图标尺寸自适应） ---------- */
.medal-fire{
  position:absolute;inset:0;z-index:1;
  pointer-events:none;overflow:hidden;border-radius:50%;
  /* 火星限制在图标圆盘内，向外自然淡出，不超出图标外圈 */
  -webkit-mask-image:radial-gradient(circle closest-side at 50% 50%,#000 84%,rgba(0,0,0,0) 100%);
  mask-image:radial-gradient(circle closest-side at 50% 50%,#000 84%,rgba(0,0,0,0) 100%);
}
/* 底部暖光只是点缀，保持小范围、始终收在按钮圆圈内 */
.medal-fire::before{
  content:"";position:absolute;left:50%;bottom:6%;
  width:52%;height:34%;transform:translateX(-50%);
  background:radial-gradient(ellipse at 50% 100%,
    rgba(255,150,44,.34), rgba(255,104,20,.14) 52%, rgba(255,96,18,0) 74%);
  animation:ember-heat 3.4s ease-in-out infinite;
}
/* 火星粒子本身放大加亮，强化的是粒子表现而不是底层光晕 */
.medal-fire i{
  position:absolute;bottom:16%;
  width:18px;height:18px;border-radius:50%;
  background:radial-gradient(circle,
    #ffffff 0%, #ffe7a0 30%, #ffab35 58%, rgba(255,104,18,0) 82%);
  opacity:0;
  animation:ember-rise 2.8s linear infinite;
}
.medal-fire i:nth-child(1){left:24%;width:24px;height:24px;animation-delay:-.15s;animation-duration:2.5s;--dx:-20px;}
.medal-fire i:nth-child(2){left:40%;width:16px;height:16px;animation-delay:-1.3s;animation-duration:3.1s;--dx:12px;}
.medal-fire i:nth-child(3){left:55%;width:24px;height:24px;animation-delay:-2.1s;animation-duration:2.7s;--dx:24px;}
.medal-fire i:nth-child(4){left:68%;width:16px;height:16px;animation-delay:-.8s;animation-duration:3.3s;--dx:16px;}
.medal-fire i:nth-child(5){left:33%;width:20px;height:20px;animation-delay:-2.6s;animation-duration:2.9s;--dx:-12px;}
.medal-fire i:nth-child(6){left:49%;width:20px;height:20px;animation-delay:-1.8s;animation-duration:2.6s;--dx:-26px;}
.medal-fire i:nth-child(7){left:29%;width:16px;height:16px;animation-delay:-.45s;animation-duration:2.8s;--dx:-16px;}
.medal-fire i:nth-child(8){left:45%;width:26px;height:26px;animation-delay:-2.4s;animation-duration:3.4s;--dx:8px;}
.medal-fire i:nth-child(9){left:61%;width:19px;height:19px;animation-delay:-1.05s;animation-duration:2.6s;--dx:20px;}
.medal-fire i:nth-child(10){left:71%;width:16px;height:16px;animation-delay:-3s;animation-duration:3.2s;--dx:26px;}
.medal-fire i:nth-child(11){left:35%;width:19px;height:19px;animation-delay:-1.65s;animation-duration:2.4s;--dx:-8px;}
.medal-fire i:nth-child(12){left:53%;width:22px;height:22px;animation-delay:-.95s;animation-duration:3s;--dx:-18px;}
@keyframes ember-rise{
  0%{opacity:0;transform:translate3d(0,10px,0) scale(.45);}
  10%{opacity:1;}
  55%{opacity:.9;}
  100%{opacity:0;transform:translate3d(var(--dx,-12px),-112px,0) scale(.14);}
}
@keyframes ember-heat{

}

/* ---------- 秘境副本按钮：强化火星 + 闪电特效（全部收在图标圆盘内） ---------- */

/* 比普通功能图标更旺的底部火光 */
.portal-fire{position:absolute;inset:0;z-index:1;pointer-events:none;}
.portal-fire::before{

.portal-fire i:nth-child(5){left:68%;width:19px;height:19px;animation-delay:-2.35s;animation-duration:2.7s;--dx:16px;}
.portal-fire i:nth-child(6){left:30%;width:16px;height:16px;animation-delay:-1.6s;animation-duration:2.6s;--dx:-10px;}
.portal-fire i:nth-child(7){left:52%;width:16px;height:16px;animation-delay:-2.7s;animation-duration:2.8s;--dx:-16px;}
.portal-fire i:nth-child(8){left:41%;width:20px;height:20px;animation-delay:-.35s;animation-duration:2.3s;--dx:-6px;}
.portal-fire i:nth-child(9){left:63%;width:15px;height:15px;animation-delay:-1.35s;animation-duration:3.1s;--dx:12px;}
.portal-fire i:nth-child(10){left:26%;width:14px;height:14px;animation-delay:-2.05s;animation-duration:2.5s;--dx:-16px;}
.portal-fire i:nth-child(11){left:38%;width:18px;height:18px;animation-delay:-.8s;animation-duration:2.7s;--dx:-4px;}
.portal-fire i:nth-child(12){left:55%;width:19px;height:19px;animation-delay:-2.5s;animation-duration:2.9s;--dx:10px;}
.portal-fire i:nth-child(13){left:45%;width:15px;height:15px;animation-delay:-1.75s;animation-duration:2.4s;--dx:4px;}
.portal-fire i:nth-child(14){left:72%;width:14px;height:14px;animation-delay:-.25s;animation-duration:2.8s;--dx:18px;}
@keyframes portal-ember-rise{
  0%{opacity:0;transform:translate3d(0,8px,0) scale(.45);}
  10%{opacity:1;}
  55%{opacity:.9;}
  100%{opacity:0;transform:translate3d(var(--dx,-8px),-72px,0) scale(.15);}
}
/* 闪电：外扩冷光 + 白色电弧芯，分段闪烁，只在爆发瞬间点亮 */
.portal-bolt{position:absolute;inset:0;width:100%;height:100%;z-index:2;}
.portal-bolt path{fill:none;stroke-linecap:round;stroke-linejoin:round;}
.portal-bolt .pb-glow{stroke:rgba(86,186,255,.6);stroke-width:8;}

.portal-bolt .pb-a{animation-delay:.15s;}
.portal-bolt .pb-b{animation-delay:1.05s;}
.portal-bolt .pb-c{animation-delay:1.85s;}
@keyframes portal-bolt-flicker{

  6%{opacity:.55;}
  8%{opacity:1;}
  10%{opacity:.2;}
  12%{opacity:.9;}
  16%{opacity:.4;}

.touch-ui.on .stick-knob{opacity:.6;}


/* ==== css/panels.css ==== */
/* ---------- 弹窗：统一使用公用二级弹框（dialog-frame 九宫纸面） ---------- */
.modal-mask{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.8);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px 18px;
  overflow:auto;
  z-index:var(--z-modal);
  pointer-events:auto;
  animation:fadeIn .18s ease-out;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{
  /* 公用关闭按钮定位：所有二级弹框共用这两个变量（相对弹框 padding box 右上角）
     --close-right 越大按钮越靠左；--close-top 越负按钮越靠上 */
  --close-right:4px;
  --close-top:-25px;
  position:relative;
  width:min(636px, 100%);
  max-width:100%;
  max-height:calc(100% - 80px);
  margin:auto;
  flex:0 0 auto;
  border-style:solid;
  border-width:55px 12px 8px 12px;
  border-image:url("assets/ui/public/dialog-frame.png") 55 12 8 12 fill stretch;
  border-radius:0;
  background:none;
  box-shadow:0 40px 110px rgba(0,0,0,.88);
  display:flex;
  flex-direction:column;
  color:#33291d;
  animation:popIn .22s cubic-bezier(.22,1,.36,1);
}
@keyframes popIn{from{transform:translateY(10px) scale(.985);opacity:.35}to{transform:none;opacity:1}}
.modal-head{
  position:relative;
  flex:0 0 auto;
  height:36px;
  padding:0;
  border:0;
  background:none;
}
/* 缎带标题：位于弹框顶部 xi 带内，白字黑描边保证任何背景都清晰 */
.modal-head h3{
  position:absolute;
  left:-12px;
  right:-12px;
  top:-46px;
  height:38px;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:0;
  font-family:var(--font);
  font-size:30px;
  font-weight:800;
  line-height:1;
  letter-spacing:2px;
  color:#fff;
  -webkit-text-stroke:3px #000;
  paint-order:stroke fill;
  text-shadow:none;
  pointer-events:none;
}
.modal-head .sub{
  position:absolute;
  left:0;
  /* 跟随关闭按钮定位，始终与其保持 12px 间距 */
  right:calc(var(--close-right) + 66.9px);
  top:2px;
  margin:0;
  text-align:center;
  font-size:18px;
  line-height:1.4;
  letter-spacing:1px;
  color:#5c4a33;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
/* 公用关闭按钮：dialog-close.png 按原图等比缩小 10%（54.9×53.1），固定弹框右上角，所有二级弹框共用同一坐标 */
.modal-close{
  position:absolute;
  top:var(--close-top);
  right:var(--close-right);
  z-index:3;
  width:54.9px;
  height:53.1px;
  padding:0;
  border:0;
  border-radius:0;
  background:url("assets/ui/public/dialog-close.png") center / 100% 100% no-repeat;
  font-size:0;
  line-height:0;
  color:transparent;
  cursor:pointer;
  -webkit-appearance:none;
  appearance:none;
  -webkit-tap-highlight-color:transparent;
  transition:filter .15s, transform .08s;
}
.modal-close:hover{filter:brightness(1.12);}
.modal-close:active{transform:scale(.92);filter:brightness(.86);}
.modal-body{padding:2px 26px 18px;overflow:auto;flex:1;min-height:0;}
.modal-foot{
  position:relative;
  padding:14px 26px 18px;
  border-top:1px solid rgba(90,60,30,.18);
  display:flex;justify-content:flex-end;gap:12px;
  background:none;
  flex:0 0 auto;
}
.confirm-text{
  font-size:22px;color:#4a3a28;line-height:1.8;
  text-align:center;padding:10px 6px 16px;letter-spacing:.5px;
}
.confirm-actions{display:flex;gap:12px;width:100%;}
.confirm-actions .btn{flex:1;}
.settle-btn{min-width:180px;}
.compare-note{font-size:17px;color:#7b6850;margin-top:4px;}
.detail-empty-glyph{

  border-color:var(--gold-2);
  box-shadow:
    0 0 0 1px rgba(201,162,95,.5),
    0 0 20px rgba(201,162,95,.25),
    inset 0 0 16px rgba(201,162,95,.18);
}

/* 装备面板：角色摘要 + 装备/属性双栏 + 背包 + 详情 */
.equip-layout{
  display:flex;
  flex-direction:column;
  gap:12px;
}
/* 角色摘要条 */
.equip-hero{
  position:relative;
  display:flex;
  align-items:center;
  gap:14px;
  padding:13px 18px;
  border:1px solid var(--sk-line);
  border-radius:2px;
  background:
    radial-gradient(ellipse at 0% 0%, rgba(201,162,95,.12), transparent 58%),
    linear-gradient(180deg,#1b1f26,#0d1014);
  box-shadow:
    inset 0 1px 0 var(--sk-hi),
    inset 0 -2px 0 var(--sk-lo),
    0 4px 14px rgba(0,0,0,.3);
}
.equip-hero::after{
  content:"";
  position:absolute;
  top:6px;right:6px;
  width:18px;height:18px;
  border-top:1px solid rgba(201,162,95,.35);
  border-right:1px solid rgba(201,162,95,.35);
  pointer-events:none;
}
.equip-hero-emblem{
  width:52px;height:52px;
  flex:0 0 auto;
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:22px;font-weight:700;
  border:1px solid rgba(201,162,95,.45);
  background:radial-gradient(circle at 40% 30%, rgba(201,162,95,.22), rgba(8,9,12,.92) 72%);
  box-shadow:0 0 0 3px rgba(0,0,0,.3), inset 0 0 16px rgba(0,0,0,.65);
}
.equip-hero-id{flex:1;min-width:0;}
.equip-hero-name{
  font-size:20px;letter-spacing:2px;color:var(--text);font-weight:600;line-height:1.25;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
}
.equip-hero-lv{
  font-size:12px;color:#231a0d;letter-spacing:.5px;
  background:linear-gradient(180deg,#e3c88e,#bf9b58);
  border-radius:2px;padding:1px 8px;
}
.equip-hero-sub{
  font-size:11.5px;color:var(--gold-dim);letter-spacing:1.5px;margin-top:4px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.equip-hero-power{text-align:right;line-height:1;flex:0 0 auto;}
.equip-hero-power span{display:block;font-size:10px;letter-spacing:3px;color:var(--dim);margin-bottom:5px;}
.equip-hero-power b{
  font-size:26px;color:var(--gold);font-weight:700;letter-spacing:1px;
  text-shadow:0 0 16px rgba(201,162,95,.25);
}
/* 段落标题：菱形符号 + 右侧信息 */
.section-label{
  font-size:12px;color:var(--gold-dim);letter-spacing:2.5px;
  margin-bottom:12px;display:flex;align-items:baseline;justify-content:space-between;gap:14px;
}
.section-label > span:first-child{display:inline-flex;align-items:center;gap:8px;}
.section-label > span:first-child::before{
  content:"◆";
  font-size:7px;color:rgba(201,162,95,.62);line-height:1;
}
.section-label .meta{font-size:12px;color:var(--text-2);letter-spacing:.5px;}
.section-label .meta b{color:var(--gold-2);font-weight:600;}
/* 装备 / 属性双栏 */
.equip-top{
  display:grid;
  grid-template-columns:minmax(0,1.22fr) minmax(0,.92fr);
  gap:12px;
  align-items:stretch;
}
.equip-doll .equip-slots{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}
/* 主体装备与饰物之间的分隔：◆ 两侧渐隐金线 */
.equip-divider{
  display:flex;align-items:center;gap:10px;
  margin:12px 0 10px;
  font-size:10px;letter-spacing:3px;color:rgba(201,162,95,.62);
}
.equip-divider::before,.equip-divider::after{
  content:"";flex:1;height:1px;
}
.equip-divider::before{background:linear-gradient(90deg,transparent,rgba(201,162,95,.28));}
.equip-divider::after{background:linear-gradient(90deg,rgba(201,162,95,.28),transparent);}
.equip-doll .equip-trinkets{grid-template-columns:repeat(3,1fr);gap:8px;}
.equip-doll .equip-trinkets .equip-slot{padding:8px 6px;gap:5px;align-items:center;}
.equip-doll .equip-trinkets .slot-label{text-align:center;font-size:9.5px;letter-spacing:1px;}
.equip-doll .equip-trinkets .slot-cell,
.equip-doll .equip-trinkets .slot-cell .item-cell{width:44px;height:44px;}
.equip-doll .equip-trinkets .slot-name{font-size:9.5px;}
.equip-slot{
  display:flex;flex-direction:column;align-items:flex-start;gap:6px;
  padding:9px 10px 10px;
  border:1px solid #3a3428;
  border-radius:2px;
  background:linear-gradient(180deg,rgba(255,255,255,.025),rgba(0,0,0,.22));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.04), inset 0 -2px 0 rgba(0,0,0,.38);
  min-width:0;
}
.equip-slot .slot-label{font-size:10.5px;color:var(--gold-dim);width:100%;letter-spacing:2px;}
.equip-slot .slot-cell{width:56px;height:56px;align-self:center;flex:0 0 auto;}
.equip-slot .slot-cell .item-cell{width:56px;height:56px;}
.slot-name{
  font-size:11px;color:var(--text-2);width:100%;text-align:center;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.equip-stats{display:flex;flex-direction:column;}
.equip-stats .stat-list{
  grid-template-columns:1fr;
  gap:0;
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:space-around;
}
.equip-stats .stat-list li{
  padding:7px 0;
  border-bottom:1px solid rgba(201,162,95,.08);
}
.equip-stats .stat-list li:last-child{border-bottom:0;padding-bottom:0;}
/* 背包容量 */
.equip-bag .section-label{margin-bottom:8px;}
.bag-cap{
  height:3px;
  background:rgba(255,255,255,.06);
  border-radius:2px;
  overflow:hidden;
  margin-bottom:10px;
  box-shadow:inset 0 1px 2px rgba(0,0,0,.5);
}
.bag-cap i{
  display:block;height:100%;
  background:linear-gradient(90deg,#8a7448,#e3c88e);
  transition:width .2s;
}
.stat-list{
  list-style:none;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px 30px;
}
.stat-list li{
  display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  font-size:12.5px;color:var(--text-2);
  padding-bottom:5px;
  border-bottom:1px dashed rgba(255,255,255,.055);
}
.stat-list li b{color:#f2ecdf;font-weight:600;font-size:14.5px;white-space:nowrap;}
.stat-list li b em{
  font-style:normal;font-size:11.5px;color:var(--muted);font-weight:400;margin-left:4px;
}
.stat-list li b.gold{color:var(--gold);}
.stat-list.compact{gap:7px 30px;}
.bag-grid{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:8px;
  align-content:start;
}
.bag-grid .item-cell{
  width:100%;
  height:auto;
  aspect-ratio:1;
  align-self:start;
}
.detail-box{
  border:1px solid #3a3428;
  border-radius:2px;
  padding:16px 18px;
  background:
    radial-gradient(circle at 100% 0%, rgba(201,162,95,.06), transparent 58%),
    linear-gradient(180deg,rgba(255,255,255,.02),rgba(0,0,0,.16));
  box-shadow:inset 0 1px 0 rgba(239,217,168,.06), inset 0 -2px 0 rgba(0,0,0,.35);
  min-height:150px;
}
.detail-empty{color:var(--dim);font-size:13px;line-height:2;padding:24px 0;text-align:center;}
.item-name{font-size:18px;font-weight:600;letter-spacing:1px;}
.item-name.r-normal{color:var(--rar-normal);}
.item-name.r-magic{color:var(--rar-magic);}
.item-name.r-rare{color:var(--rar-rare);}
.item-name.r-set{color:var(--rar-set);}
.item-name.r-legend{color:var(--rar-legend);}
.item-type{font-size:12.5px;color:var(--muted);margin:4px 0 12px;letter-spacing:.5px;}
.item-stat{
  font-size:13px;color:#aab6c6;line-height:1.95;
  display:flex;justify-content:space-between;gap:20px;
}
.item-stat span:last-child{color:#e6eef8;font-weight:600;}
.compare{
  margin-top:12px;padding-top:10px;border-top:1px dashed #2c2e34;
  font-size:12.5px;
}
.compare .up{color:var(--ok);}
.compare .down{color:var(--danger);}
.compare .same{color:var(--muted);}
.rarity-tag{
  display:inline-block;font-size:10.5px;padding:1px 6px;border-radius:2px;
  border:1px solid currentColor;margin-left:8px;vertical-align:2px;letter-spacing:1px;
}
.detail-actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;justify-content:flex-end;}

/* ---------- 技能 ---------- */
.skill-list{display:flex;flex-direction:column;gap:12px;}
.skill-row{
  display:grid;
  grid-template-columns:60px 1fr auto;
  gap:16px;
  align-items:center;
  padding:16px;
  border:1px solid #2d3038;
  border-radius:5px;
  background:linear-gradient(180deg,rgba(255,255,255,.02),rgba(255,255,255,0));
}
.skill-icon{
  width:60px;height:60px;
  display:flex;align-items:center;justify-content:center;
  font-size:22px;font-weight:700;
  border:1px solid #3d4048;border-radius:5px;
  background:linear-gradient(160deg,#1e2128,#121419);
  color:#cfc7b4;
}
.skill-icon.basic{color:#c3d3ea;}
.skill-name{font-size:16px;color:var(--text);letter-spacing:1px;display:flex;align-items:center;flex-wrap:wrap;gap:8px;}
.skill-name .lv{
  font-size:11.5px;color:var(--gold-2);margin-left:0;letter-spacing:.5px;
  background:rgba(201,162,95,.1);
  border:1px solid rgba(201,162,95,.28);
  padding:1px 8px;border-radius:20px;
}
.skill-name .key-tip{font-size:11.5px;color:var(--dim);letter-spacing:1px;}
.skill-desc{font-size:13px;color:#c4bdae;margin-top:7px;line-height:1.75;}
.skill-desc em{color:#eadcba;font-style:normal;}
.skill-next{font-size:12px;color:var(--dim);margin-top:5px;}
.skill-plus{display:flex;flex-direction:column;align-items:center;gap:6px;}
.skill-plus .btn{width:74px;height:38px;font-size:15px;border-width:12px 18px;padding:0;}
.skill-plus .cost{font-size:11px;color:#8f897c;}
.point-badge{
  display:inline-block;font-size:12.5px;color:#1d170c;background:var(--gold);
  padding:1px 9px;border-radius:10px;margin-left:6px;font-weight:700;
}
.modal-body .note{
  font-size:12px;color:var(--dim);margin-top:16px;line-height:1.9;
}

/* ---------- 结算 ---------- */
.result-banner{
  text-align:center;
  padding:10px 0 20px;
}
.result-banner h2{
  font-size:34px;letter-spacing:12px;color:var(--gold);font-weight:700;
  text-shadow:0 0 26px rgba(201,162,95,.25);
}
.result-banner.fail h2{color:var(--danger);text-shadow:0 0 26px rgba(208,101,93,.2);}
.result-banner p{font-size:12.5px;color:var(--muted);margin-top:8px;letter-spacing:2px;}
.result-grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px;
}
.result-cell{
  border:1px solid #2d3038;border-radius:5px;padding:14px 14px;
  background:rgba(255,255,255,.016);
}
.result-cell .k{font-size:11.5px;color:var(--muted);letter-spacing:1px;}
.result-cell .v{font-size:21px;color:var(--text);font-weight:600;margin-top:3px;line-height:1.2;}
.result-cell .v.gold{color:var(--gold-2);}
.result-cell .v.ok{color:var(--ok);}
.loot-area{
  border:1px solid #2d3038;border-radius:5px;padding:16px 18px;
  background:rgba(255,255,255,.012);
  min-height:96px;
}
.loot-title{font-size:12px;color:var(--gold-dim);letter-spacing:2px;margin-bottom:14px;display:flex;justify-content:space-between;}
.loot-title span:last-child{color:var(--dim);letter-spacing:.5px;}
.loot-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;}
.loot-empty{font-size:12.5px;color:var(--dim);padding:8px 0;}
.loot-cell{
  width:86px;height:92px;border-radius:4px;
  border:0;background:none;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  font-size:22px;font-weight:700;color:#c6c0b2;
  position:relative;
  padding:0 8px;
}
/* 公用道具框铺满格面并保持原始比例，避免拉伸；文字叠在上层 */
.loot-frame{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:contain;
  pointer-events:none;border-radius:4px;
}
.loot-cell > :not(.loot-frame){position:relative;z-index:1;}
.loot-glyph{position:relative;z-index:1;line-height:1;}
.loot-cell .loot-name{
  font-size:11.5px;font-weight:400;color:var(--text-2);
  max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  text-shadow:0 1px 2px rgba(0,0,0,.85);
}
.loot-cell.r-magic{color:#a8c6f0;}
.loot-cell.r-rare{color:#f0d27a;}
.loot-cell.r-set{color:#a8e0a0;}
.loot-cell.r-legend{color:#f5b07a;}
.loot-cell .qty{
  position:absolute;right:9px;top:7px;font-size:11px;color:var(--muted);
  text-shadow:0 1px 2px rgba(0,0,0,.85);
}
.levelup-note{
  font-size:12.5px;color:var(--gold-2);margin-top:6px;letter-spacing:.5px;
}
.skillup-note{font-size:12.5px;color:#a9c6ec;margin-top:6px;letter-spacing:.5px;}

/* ---------- 提示：菜单位于底部安全区，战斗中右上角，弹窗时置顶 ---------- */
.toast-wrap{
  position:absolute;
  left:50%;
  bottom:30px;
  transform:translateX(-50%);
  width:min(440px, calc(100% - 48px));
  display:flex;flex-direction:column;gap:8px;
  z-index:var(--z-toast);
  pointer-events:none;
  align-items:stretch;
}
/* 打开弹窗时移到画面最上方，避免遮挡弹窗标题与关闭按钮 */
.toast-wrap.over-modal{top:24px;bottom:auto;}
/* 主城：提示居中展示，避免与底部图标、场景角色挤在一角 */
#ui:has(.town-screen) + .toast-wrap:not(.over-modal){
  top:50%;bottom:auto;
  transform:translate(-50%,-50%);
}
/* 战斗中放到右下角技能栏上方，避开顶部进度 / 小地图 / 首领血条 */
.toast-wrap.in-battle{
  top:auto;bottom:320px;
  left:auto;right:22px;
  transform:none;
  width:360px;
}
.toast{
  font-size:13px;
  line-height:1.5;
  color:var(--text);
  background:rgba(12,14,18,.95);
  border:1px solid #3b3f47;
  border-left:3px solid var(--gold-dim);
  padding:10px 14px;
  border-radius:3px;
  letter-spacing:.5px;
  box-shadow:0 10px 30px rgba(0,0,0,.6);
  animation:toastIn .2s ease-out;
  word-break:break-word;
}
.toast.gold{border-left-color:var(--gold);color:var(--gold-2);}
.toast.blue{border-left-color:var(--blue);color:#b3ccef;}
.toast.danger{border-left-color:var(--danger);color:#f0aca5;}
.toast.fade{opacity:0;transition:opacity .35s, transform .35s;transform:translateX(12px);}
@keyframes toastIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}


/* ============ 技能 / 天赋 页签 ============ */
.tab-bar{display:flex;gap:8px;margin-bottom:16px;}
.tab-btn{
  height:38px;padding:0 24px;border:1px solid var(--line-mid);border-radius:8px;
  background:rgba(255,255,255,.02);color:var(--muted);font-family:var(--font);
  font-size:14px;letter-spacing:2px;cursor:pointer;
  transition:color .15s,border-color .15s,background .15s;
}
.tab-btn:hover{color:var(--text);border-color:var(--gold-dim);}
.tab-btn.sel{color:#1d170c;background:var(--gold);border-color:var(--gold);font-weight:600;}
.tab-content{min-height:320px;}

/* ============ 秘境副本：整屏关卡选择（按 PSD 切图还原） ============ */
.secret-screen{
  position:absolute;inset:0;z-index:var(--z-modal);overflow:hidden;
  /* #ui 默认 pointer-events:none，整屏层必须单独开启，否则页签/关卡/按钮全部点不到 */
  pointer-events:auto;
  /* 中段纯色取自 bg.png，上下美术由伪元素按效果图锚点拼接 */
  background:#381c18;
  animation:screenIn .26s cubic-bezier(.22,1,.36,1);
}
/* 顶部传送门 + 红色标题带：bg.png 整体上移 69px，让标题带落在 338-391，与效果图一致。
   原图 0-69px 为纯黑，裁切无可见损失；411 以下本身也是纯色，接缝不可见。 */
.secret-screen::before{
  content:"";position:absolute;left:0;top:0;width:100%;height:411px;z-index:0;
  background:url("assets/ui/secret/bg.png") center -69px/100% auto no-repeat;
  pointer-events:none;
}
/* 底部石带：bg.png 下移 37px，石带落在 1264-1275，按钮上沿压在石带上，与效果图一致 */
.secret-screen::after{
  content:"";position:absolute;left:0;bottom:0;width:100%;height:195px;z-index:0;
  background:url("assets/ui/secret/bg.png") center -1208px/100% auto no-repeat;
  pointer-events:none;
}

/* 公用关闭按钮：沿用二级弹框的 61×59 公用切图，按 PSD 固定在右上 */
.secret-close{
  position:absolute;top:138px;right:29px;z-index:4;
  width:61px;height:59px;border:0;padding:0;
  background:url("assets/ui/public/dialog-close.png") center/100% 100% no-repeat;
  font-size:0;color:transparent;cursor:pointer;
}
.secret-close:active{transform:scale(.92);filter:brightness(.86);}

/* 章节页签：底边对齐标题带，选中页签更高并染成绯红 */
.secret-tabs{
  position:absolute;left:0;right:0;top:213px;height:115px;
  display:flex;align-items:flex-end;justify-content:center;gap:46px;
  z-index:2;
}
.secret-tab{
  position:relative;width:97px;height:95px;padding:8px 6px 12px;
  border:0;display:flex;align-items:center;justify-content:center;
  background:url("assets/ui/secret/tab.png") center bottom/100% 100% no-repeat;
  font-family:var(--font);color:#efe3d2;cursor:pointer;
  transition:transform .08s ease,filter .14s ease;
}
.secret-tab b{
  position:relative;z-index:1;
  font-size:40px;line-height:1;font-weight:800;letter-spacing:1px;
  text-shadow:0 2px 4px rgba(0,0,0,.66);
}
.secret-tab .st-label{display:none;}
.secret-tab:hover{filter:brightness(1.1);}
.secret-tab:active{transform:translateY(1px) scale(.97);}
.secret-tab.on{
  height:115px;flex-direction:column;gap:7px;padding-bottom:17px;
  background-image:url("assets/ui/secret/tab-on.png");
}
.secret-tab.on .st-label{
  display:block;font-size:26px;line-height:1;font-weight:700;
  letter-spacing:2px;color:#fff4e6;text-shadow:0 2px 4px rgba(60,0,12,.7);
}
/* 未解锁章节：黑色遮罩压暗页签，锁图标压在页签顶部 */
.secret-tab.locked{cursor:not-allowed;}
.secret-tab.locked:hover{filter:none;}
.secret-tab.locked:active{transform:none;}
.secret-tab.locked b{opacity:.5;}
.secret-tab .s-mask{
  position:absolute;inset:0;pointer-events:none;
  background:url("assets/ui/secret/tab-mask.png") center/100% 100% no-repeat;
}
.secret-tab .s-lock{
  position:absolute;left:50%;top:-23px;z-index:3;
  width:44px;height:51px;transform:translateX(-50%);pointer-events:none;
  background:url("assets/ui/public/lock.png") center/contain no-repeat;
  filter:drop-shadow(0 3px 6px rgba(0,0,0,.8));
}

/* 标题带文字（底图已含裂纹石板） */
.secret-title{
  position:absolute;left:0;right:0;top:319px;height:87px;margin:0;z-index:2;
  display:flex;align-items:center;justify-content:center;
  font-size:40px;font-weight:800;letter-spacing:12px;text-indent:12px;
  color:#fff;
  -webkit-text-stroke:3px #000;paint-order:stroke fill;
  text-shadow:none;
  pointer-events:none;
}

/* 关卡列表：按 PSD 绝对坐标排列，首行紧贴标题带（429），行距 16，不随关卡数量上下浮动 */
.secret-list{
  position:absolute;left:82px;top:429px;width:559px;height:836px;
  padding:12px 12px 8px;box-sizing:border-box;
  display:flex;flex-direction:column;gap:16px;
  overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:thin;scrollbar-color:rgba(196,120,74,.55) transparent;
  z-index:2;
}
.secret-list::-webkit-scrollbar{width:6px;}
.secret-list::-webkit-scrollbar-track{background:rgba(0,0,0,.25);border-radius:3px;}
.secret-list::-webkit-scrollbar-thumb{background:rgba(196,120,74,.55);border-radius:3px;}
.secret-row{
  position:relative;flex:0 0 92px;width:535px;height:92px;padding:0;border:0;
  background:url("assets/ui/secret/row.png") center/100% 100% no-repeat;
  font-family:var(--font);text-align:left;cursor:pointer;
  transition:filter .14s ease,transform .08s ease;
}
.secret-row:hover{filter:brightness(1.07);}
.secret-row:active{transform:scale(.99);}
.secret-row.sel::before{
  content:"";position:absolute;left:50%;top:50%;width:555px;height:114px;
  transform:translate(-50%,-50%);
  background:url("assets/ui/secret/row-sel.png") center/100% 100% no-repeat;
  pointer-events:none;
}
.secret-row .s-num,
.secret-row .s-name,
.secret-row .s-meta{position:absolute;top:50%;transform:translateY(-50%);z-index:1;}
.secret-row .s-num{
  left:16px;width:61px;height:61px;display:flex;align-items:center;justify-content:center;
  background:url("assets/ui/secret/num.png") center/100% 100% no-repeat;
  font-size:34px;font-weight:800;line-height:1;color:#ffefd8;
  text-shadow:0 2px 4px rgba(0,0,0,.7);
}
.secret-row .s-name{
  left:101px;max-width:196px;white-space:nowrap;
  font-size:32px;font-weight:700;letter-spacing:2px;color:#fff;
  text-shadow:0 2px 5px rgba(0,0,0,.72);
}
.secret-row .s-meta{
  left:303px;display:flex;flex-direction:column;gap:4px;
  font-size:24px;line-height:1.25;letter-spacing:1px;font-weight:600;
  color:#e9a468;font-style:normal;white-space:nowrap;
  text-shadow:0 1px 3px rgba(0,0,0,.65);
}
.secret-row .s-meta em{font-style:normal;}
.secret-row.locked{cursor:not-allowed;}
.secret-row.locked:hover{filter:none;}
/* 未解锁：纯黑半透明遮罩压暗底图，右侧锁图标 */
.secret-row .s-mask{
  position:absolute;inset:0;z-index:0;pointer-events:none;
  background:url("assets/ui/secret/row-mask.png") center/100% 100% no-repeat;
}
.secret-row .s-lock{
  position:absolute;right:22px;top:50%;z-index:2;
  width:42px;height:48px;transform:translateY(-50%);pointer-events:none;
  background:url("assets/ui/public/lock.png") center/contain no-repeat;
  filter:drop-shadow(0 2px 5px rgba(0,0,0,.75));
}
.secret-row.locked .s-num,
.secret-row.locked .s-name,
.secret-row.locked .s-meta{opacity:.55;}

/* 底部进入副本：公用红底按钮，按 PSD 尺寸放宽中间平色区（高度保持 98 不压板） */
.secret-foot{
  position:absolute;left:0;right:0;top:1286px;z-index:2;
  display:flex;justify-content:center;
}
.secret-foot .btn{
  width:253px;min-width:253px;height:98px;padding:0 12px;
  font-size:30px;letter-spacing:6px;
}
.secret-foot .btn.off{filter:grayscale(.55) brightness(.62);}

/* ============ 技能树 ============ */
.tree-list{display:flex;flex-direction:column;gap:14px;}
.tree-block{
  border:1px solid var(--line-soft);border-radius:8px;
  padding:12px 14px 14px;background:rgba(255,255,255,.012);
}
.tree-head{
  display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  margin-bottom:11px;padding-bottom:9px;border-bottom:1px dashed rgba(255,255,255,.07);
}
.tree-head b{font-size:15px;color:var(--gold-2);letter-spacing:2px;font-weight:600;}
.tree-head .meta{font-size:11.5px;color:var(--dim);letter-spacing:.5px;}
.tree-nodes{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;}
.tree-node{
  position:relative;display:flex;flex-direction:column;gap:4px;width:100%;
  padding:10px 10px 9px;border:1px solid var(--line-mid);border-radius:6px;
  background:linear-gradient(160deg,#1e2128,#121419);
  color:var(--text-2);font-family:var(--font);text-align:left;cursor:pointer;
  transition:border-color .15s,background .15s,opacity .15s;
}
.tree-node b{font-size:12.5px;font-weight:600;color:var(--text-2);letter-spacing:.5px;}
.tree-node p{font-size:11px;color:var(--dim);line-height:1.55;min-height:34px;}
.tree-node em{font-style:normal;font-size:10.5px;color:#b1655f;line-height:1.4;}
.tn-idx{
  position:absolute;right:7px;top:6px;
  font-size:10px;font-weight:700;color:var(--muted);
  border:1px solid var(--line-mid);border-radius:3px;padding:0 4px;
}
.tree-node.can{border-color:var(--gold-dim);box-shadow:0 0 0 0 rgba(201,162,95,0);}
.tree-node.can b{color:var(--gold-2);}
.tree-node.can:hover{transform:translateY(-1px);border-color:var(--gold);}
.tree-node.on{
  border-color:var(--gold);
  background:linear-gradient(160deg,#2c2517,#17130b);
  box-shadow:inset 0 0 12px rgba(210,171,104,.14);
}
.tree-node.on b{color:var(--gold-2);}
.tree-node.on .tn-idx{color:#1d170c;background:var(--gold);border-color:var(--gold-2);}
.tree-node.locked{opacity:.56;cursor:not-allowed;}
.tree-node[disabled]{cursor:not-allowed;}
.tree-node.on[disabled]{cursor:default;opacity:1;}
.tree-head .meta .btn{margin-left:10px;}

/* ============================================================
   公用二级弹框 · 纸面主题
   ------------------------------------------------------------
   弹框框体统一使用 assets/ui/public/dialog-frame.png，
   内部文字统一为深墨色、卡片统一为浅纸色，
   避免原来深色卡片 + 浅色文字在纸面上看不清。
   ============================================================ */
.modal{
  --text:#33291d;
  --text-2:#4d3e2c;
  --muted:#6a5840;
  --dim:#7b6850;
  --faint:#8a775e;
  --gold:#7d4c12;
  --gold-2:#8f5a17;
  --gold-dim:#96713c;
  --danger:#a33a2c;
  --danger-2:#8f2f22;
  --ok:#4d7938;
  --blue:#3c6396;
  --line:#c2a97f;
  --line-mid:#cbb58f;
  --line-soft:#d3bf9a;
  --rar-normal:#5f574b;
  --rar-magic:#2f5f9e;
  --rar-rare:#7a3ba8;
  --rar-set:#2f7a3a;
  --rar-legend:#a84e12;
  --sk-line:#c2a97f;
  --sk-line-soft:rgba(90,60,30,.18);
  --sk-hi:rgba(255,250,238,.6);
  --sk-lo:rgba(90,60,30,.14);
  --sk-ink-0:#f2e7d2;
  --sk-ink-1:#ecdfc7;
  --sk-ink-2:#e4d5b9;
}
.modal-body{line-height:1.6;}

/* ---------- 弹框内按钮：统一公用九宫按钮 ----------
   高度固定 98，装饰角按资源原像素 1:1 渲染；宽度只压缩中间平色区，
   因此行内次要操作可以使用更窄的按钮，既不放大也不变形。 */
.modal .btn{font-size:36px;letter-spacing:1px;}
.modal .btn-sm{font-size:32px;padding:0 20px;letter-spacing:.5px;}
.modal .confirm-actions .btn{height:98px;font-size:36px;}

/* 技能行：图标 | 说明 | 紧凑升级按钮，按钮不再独占一整行 */
.modal .skill-row{
  grid-template-columns:70px minmax(0,1fr) 158px;
  grid-template-areas:"icon main plus";
  align-items:center;
  gap:10px 14px;
  padding:14px 16px;
}
.modal .skill-icon{grid-area:icon;}
.modal .skill-row > div:nth-child(2){grid-area:main;}
.modal .skill-plus{
  grid-area:plus;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:8px;
}
.modal .skill-plus .btn{min-width:150px;width:auto;height:98px;padding:0 10px;font-size:36px;}
.modal .skill-plus .cost{order:0;margin:0;font-size:16px;color:#6a5840;}

/* 标题行右侧的次要按钮（重置等）：紧凑宽度，与点数徽章保持同一行 */

.modal .section-label .meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end;}
.modal .section-label .meta .btn{min-width:150px;height:98px;padding:0 12px;font-size:36px;}

.modal .section-label > span:first-child{white-space:nowrap;}
.modal .section-label{align-items:center;}

.modal .skill-next,
.modal .skill-plus .cost,
.modal .modal-body .note,
.modal .settings-note,

.modal .skill-name .lv{background:rgba(255,246,225,.9);border-color:#b8934f;padding:2px 9px;}

/* ---------- 弹框内按钮：统一按压反馈 ---------- */

.pause-card .btn:active{
  transform:translateY(2px) scale(.92);
  filter:brightness(.9);
}
.modal .tab-btn,
.modal .seg-btn{transition:transform .06s ease, filter .14s ease, color .15s, border-color .15s, background .15s;}
.modal .tab-btn:active,
.modal .seg-btn:active{
  transform:translateY(1px) scale(.92);
  filter:brightness(.92);
}
.modal .modal-close:active,
.pause-card .modal-close:active{transform:scale(.92);filter:brightness(.86);}

/* ============================================================
   任务面板（主线 / 悬赏）
   ------------------------------------------------------------
   只出现在公用纸面弹框内：外壳、页签与按钮全部复用
   .modal / .tab-btn / .btn，不新增图片资源。
   状态色：进行中=褐、可领取=金、已完成=绿、待推进=虚线灰。
   弹框固定 636×1000，内部页签、卡片与操作区高度固定，
   切换页签或任务状态不会改变整体结构尺寸。
   ============================================================ */
.modal.quest-modal{height:1000px;}
.modal.quest-modal .modal-body{
  display:flex;flex-direction:column;
  overflow:hidden;
}
.modal.quest-modal .quest-body{
  flex:1 1 auto;min-height:0;
  display:flex;flex-direction:column;
}
.quest-panel{
  flex:1 1 auto;min-height:0;
  display:flex;flex-direction:column;gap:14px;
}
.quest-panel .tab-bar{gap:10px;margin-bottom:0;}
.quest-panel .tab-btn{
  flex:1 1 0;justify-content:center;
  display:inline-flex;align-items:center;gap:8px;
  padding:0 12px;font-size:23px;
}
.qp-tab-num{
  font-style:normal;font-size:20px;font-weight:700;letter-spacing:.5px;
  padding:1px 8px;border-radius:10px;
  color:#5c4a33;background:rgba(143,90,23,.14);
  border:1px solid rgba(150,113,60,.45);
}
.tab-btn.sel .qp-tab-num{
  color:#fff8ea;background:rgba(255,248,234,.16);
  border-color:rgba(255,248,234,.4);
}
.qp-tab-dot{
  width:11px;height:11px;border-radius:50%;
  background:#c8442f;box-shadow:0 0 0 3px rgba(200,68,47,.16);
  animation:qp-pulse 1.6s ease-in-out infinite;
}
@keyframes qp-pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.25);opacity:.7}}

.qp-view{
  flex:1 1 auto;min-height:0;
  display:flex;flex-direction:column;gap:10px;
}
/* 副标题位于纸面顶部，任务面板内加深一档 */
.modal.quest-modal .modal-head .sub{font-size:20px;color:#4a3a28;}

/* ---------- 主线：当前任务 ---------- */
.qp-hero{
  position:relative;
  flex:1 1 auto;min-height:0;
  display:flex;flex-direction:column;
  padding:16px 18px 18px;
  border:1px solid #b8934f;
  background:
    radial-gradient(circle at 100% 0%, rgba(169,124,46,.14), transparent 58%),
    linear-gradient(180deg,rgba(255,250,238,.9),rgba(233,216,183,.62));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.6), inset 0 -1px 0 rgba(90,60,30,.12);
}
.qp-hero.ready{
  border-color:#a97c2e;
  box-shadow:inset 0 0 26px rgba(169,124,46,.16), inset 0 1px 0 rgba(255,255,255,.6);
}
.qp-hero.done{
  justify-content:center;
  border-color:#8faa74;
  background:linear-gradient(180deg,rgba(250,250,240,.86),rgba(216,222,198,.6));
}
.qp-hero-head{display:flex;align-items:center;gap:14px;}
.qp-step{
  flex:0 0 auto;width:64px;height:64px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  border-radius:50%;border:1px solid #b8934f;
  background:radial-gradient(circle at 40% 30%,#fff8ea,#e2c892 72%);
  box-shadow:inset 0 0 0 3px rgba(255,255,255,.35), 0 2px 6px rgba(120,85,35,.18);
}
.qp-step b{font-size:27px;line-height:1;color:#7d4c12;}
.qp-step span{font-size:20px;line-height:1;color:#8f7550;letter-spacing:0;}
.qp-hero-id{flex:1;min-width:0;}
.qp-kicker{font-size:20px;line-height:1;letter-spacing:3px;color:#7d4c12;font-weight:600;}
.qp-hero-id h4{
  margin:7px 0 0;
  font-size:30px;line-height:1.2;font-weight:800;letter-spacing:1px;color:#2b2117;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}

/* ---------- 状态签 ---------- */
.qp-tag{
  flex:0 0 auto;
  display:inline-flex;align-items:center;gap:6px;
  padding:7px 15px;border-radius:20px;
  border:1px solid #b8934f;background:rgba(255,250,238,.7);
  font-size:22px;line-height:1;letter-spacing:1px;color:#5c4a33;
  white-space:nowrap;
}
.qp-tag.ready{
  color:#7a3d0c;border-color:#a97c2e;font-weight:700;
  background:linear-gradient(180deg,#f6e2b6,#e4c88f);
  box-shadow:0 0 12px rgba(169,124,46,.22);
}
.qp-tag.ready::before{
  content:"";width:8px;height:8px;border-radius:50%;
  background:#b5651c;box-shadow:0 0 8px rgba(181,101,28,.85);
}
.qp-tag.done{color:#3f6b30;border-color:#8faa74;background:rgba(143,170,116,.16);}
.qp-tag.todo{color:#5c4a33;border-color:#b8934f;border-style:dashed;background:rgba(255,250,238,.42);}

/* ---------- 任务文案 ---------- */
.qp-lore{margin:14px 0 0;font-size:22px;line-height:1.7;font-style:italic;color:#5c4a33;}
.qp-desc{margin:10px 0 0;font-size:24px;line-height:1.65;color:#33291d;}
.qp-objective{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  margin-top:14px;padding:10px 14px;
  border:1px dashed rgba(150,113,60,.5);
  background:rgba(255,250,238,.5);
}
.qp-objective > span{font-size:20px;letter-spacing:2px;color:#5c4a33;}
.qp-objective b{font-size:24px;color:#3a2d20;}
.qp-objective em{margin-left:auto;font-style:normal;font-size:20px;color:#5c4a33;}
.qp-objective em.ok{color:#3f6b30;font-weight:700;}

/* ---------- 进度 ---------- */
.qp-progress-row{
  display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  margin-top:14px;font-size:20px;color:#4a3a28;
}
.qp-progress-row b{font-size:22px;color:#7d4c12;}
.qp-bar{
  height:14px;margin-top:8px;border-radius:7px;overflow:hidden;
  background:rgba(90,60,30,.16);
  box-shadow:inset 0 2px 4px rgba(90,60,30,.22);
}
.qp-bar i{
  display:block;height:100%;border-radius:7px;
  background:linear-gradient(90deg,#a97c2e,#e6c98b);
  box-shadow:0 0 8px rgba(169,124,46,.35);
  transition:width .3s ease-out;
}
.qp-bounty.ready .qp-bar i{background:linear-gradient(90deg,#7fae63,#c0dd9a);}

/* ---------- 奖励徽记 ---------- */
/* 奖励固定在卡片底部，进度条与说明留在上方，拉长后仍然稳定 */
.qp-rewards{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:14px;}
.qp-hero .qp-rewards{margin-top:auto;padding-top:14px;}
.qp-chip{
  display:inline-flex;align-items:center;gap:6px;
  padding:4px 10px 4px 4px;border-radius:4px;
  border:1px solid rgba(150,113,60,.45);
  background:rgba(255,250,238,.72);
  font-size:20px;font-weight:700;line-height:1.35;color:#3a2d20;
}
.qp-chip i{
  width:30px;height:30px;border-radius:3px;
  display:inline-flex;align-items:center;justify-content:center;
  font-style:normal;font-size:20px;font-weight:700;line-height:1;
  color:#fff8ea;background:#8f5a17;
}
.qp-chip.gold i{background:#a97c2e;}
.qp-chip.xp i{background:#4a6f9e;}
.qp-chip.tree i{background:#5d7f47;}
.qp-chip.skill i{background:#6b4a9a;}

/* ---------- 操作区 ---------- */
/* 按钮按公用资源 238×98 等比缩到 70%（167×69），不横向拉长 */
.quest-panel .btn{
  min-width:167px;width:167px;height:69px;
  padding:0 6px;
  border-width:21px 28px;
  font-size:25px;
  letter-spacing:.5px;
}
.qp-actions{display:flex;justify-content:flex-end;gap:12px;margin-top:16px;}
.qp-actions .btn{flex:0 0 auto;}
.qp-go{flex:0 0 auto;align-self:flex-end;margin-top:2px;}

/* ---------- 后续主线 ---------- */
.qp-section{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  margin-top:2px;font-size:22px;font-weight:600;letter-spacing:2px;color:#7d4c12;
}
.qp-section em{font-style:normal;font-size:20px;font-weight:400;letter-spacing:.5px;color:#5c4a33;}
.qp-next-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;}
.qp-next{
  display:flex;align-items:center;gap:12px;
  flex:0 0 auto;height:64px;
  padding:0 14px;border:1px solid #c2a97f;
  background:rgba(255,250,238,.42);
}
.qp-next b{
  flex:0 0 auto;width:36px;height:36px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  border:1px solid #c2a97f;background:rgba(255,250,238,.7);
  font-size:20px;color:#5c4a33;line-height:1;
}
.qp-next-name{
  flex:1 1 auto;min-width:0;font-size:23px;color:#3a2d20;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.qp-next-stage{
  flex:0 0 auto;max-width:170px;font-size:20px;color:#5c4a33;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.qp-next .qp-tag{padding:5px 10px;font-size:20px;}

/* ---------- 悬赏 ---------- */
.qp-sum{flex:0 0 auto;display:flex;gap:10px;}
.qp-sum span{
  flex:1 1 0;
  display:flex;align-items:baseline;justify-content:center;gap:8px;
  height:46px;padding:0 10px;border:1px solid #c2a97f;
  background:rgba(255,250,238,.55);
  font-size:20px;color:#4a3a28;
}
.qp-sum b{font-size:28px;line-height:1;color:#7d4c12;}
.qp-hint{
  flex:0 0 auto;
  display:flex;align-items:center;
  height:46px;padding:0 14px;
  border-left:3px solid #b8934f;
  background:rgba(255,250,238,.55);
  font-size:20px;line-height:1.4;color:#4a3a28;
}
.qp-bounty-list{
  flex:1 1 auto;min-height:0;
  display:flex;flex-direction:column;gap:8px;
}
.qp-bounty{
  display:flex;align-items:center;gap:14px;
  flex:1 1 0;min-height:0;
  padding:10px 16px 12px;
  border:1px solid #c2a97f;
  background:linear-gradient(180deg,rgba(255,250,238,.62),rgba(228,210,176,.42));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5);
}
.qp-bounty.ready{
  border-color:#a97c2e;
  box-shadow:inset 0 0 20px rgba(169,124,46,.14), inset 0 1px 0 rgba(255,255,255,.5);
}
.qp-bounty-icon{
  flex:0 0 auto;width:58px;height:58px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  border:1px solid #b8934f;
  background:radial-gradient(circle at 38% 30%,#fff8ea,#ddc391 74%);
  box-shadow:inset 0 0 0 3px rgba(255,255,255,.32);
  font-size:28px;font-weight:800;line-height:1;color:#7d4c12;
}
.qp-bounty.ready .qp-bounty-icon{
  box-shadow:inset 0 0 0 3px rgba(255,255,255,.32), 0 0 14px rgba(169,124,46,.4);
}
.qp-bounty-main{flex:1;min-width:0;overflow:hidden;}

.sk-points b{font-size:28px;line-height:1;color:#ff9535;}

/* 分组标题条 */
.sk-band{

/* 技能树容器 */
.sk-tree{position:absolute;inset:0;pointer-events:none;}
.sk-lines{position:absolute;inset:0;z-index:1;}
.sk-line{
  position:absolute;transform-origin:top center;pointer-events:none;
  background:url("assets/ui/skill/line.png") 0 0/100% 100% no-repeat;
}
/* 已激活 / 可激活的线路：黄色内芯嵌进黑色线路，左右各留 1px 黑边 */
.sk-line.lit::before{
  content:'';position:absolute;left:1px;right:1px;top:0;bottom:0;
  background:url("assets/ui/skill/line-active.png") 0 0/100% 100% no-repeat;
  filter:drop-shadow(0 0 4px rgba(255,183,42,.7));
}

/* 节点 */
.sk-node{
  position:absolute;padding:0;border:0;background:none;cursor:pointer;
  pointer-events:auto;z-index:2;-webkit-tap-highlight-color:transparent;
}
.sk-frame{position:absolute;left:0;top:0;width:100%;height:100%;display:block;}
.sk-icon{position:absolute;display:block;}
.sk-root .sk-frame{filter:drop-shadow(0 5px 7px rgba(0,0,0,.4));}

/* 未解锁 / 未激活 / 可激活 三态 */
.sk-tree.locked .sk-root .sk-frame,
.sk-tree.locked .sk-root .sk-icon{filter:grayscale(1) brightness(.5);}
.sk-tree.locked .sk-aux .sk-icon{filter:grayscale(1) brightness(.48);}
.sk-node.sk-aux.off .sk-icon{filter:grayscale(.85) brightness(.58);}
/* 可激活：图标置灰，叠上待激活选中框（86×86，居中于 67×65 节点） */
.sk-node.sk-aux.can .sk-icon{filter:grayscale(1) brightness(.72);}
.sk-node.sk-aux.can::before{

}

.sk-node.sk-aux.on::after{
  content:'';position:absolute;inset:-4px;border-radius:9px;pointer-events:none;
  box-shadow:0 0 14px var(--tc);opacity:.55;
}
@keyframes sk-select{
  0%,100%{opacity:.62;transform:scale(.985);}
  50%{opacity:1;transform:scale(1.015);}
}

/* 名称标签：白色字 + 深色描边 */
.sk-label{

}

/* 主技能未解锁等级提示（压在灰色图标下沿，避开名称标签） */

/* ==== css/battle.css ==== */
/* ---------- 战斗 HUD（竖版纵向） ---------- */
.dungeon-ui{position:absolute;inset:0;pointer-events:none;z-index:var(--z-hud);}
.dungeon-ui::before{
  content:"";
  position:absolute;top:0;left:0;right:0;height:200px;
  background:linear-gradient(180deg,rgba(3,5,6,.78),rgba(3,5,6,0));
  pointer-events:none;
  z-index:-1;
}
.dungeon-ui::after{
  content:"";
  position:absolute;left:0;right:0;bottom:0;height:300px;
  background:linear-gradient(0deg,rgba(3,5,6,.88),rgba(3,5,6,0));
  pointer-events:none;
  z-index:-1;
}
.dungeon-ui .clickable{pointer-events:auto;}
/* 顶部（PSD 720×1440 绝对坐标）：关卡进度 / 小地图 / 暂停 */
.dg-top{position:absolute;inset:0;pointer-events:none;}

/* 第 1 块：关卡进度，底盘 340×94 @(18,38) */
.dg-progress{position:absolute;left:18px;top:38px;width:340px;height:94px;}
.dg-progress .dp-plate{position:absolute;inset:0;width:100%;height:100%;display:block;}
/* 红色底盘（.dp-plate）静止；光晕放在外层，旋转由 JS 帧循环驱动内层沙漏，两层互不影响 */
.dg-progress .dp-hourglass-glow{
  position:absolute;left:26.5px;top:26px;width:50px;height:51px;
  animation:hgGlow 3.2s ease-in-out infinite;
  pointer-events:none;
}
.dg-progress .dp-hourglass{
  width:100%;height:100%;display:block;
  transform-origin:50% 50%;
  will-change:transform;
}
.dp-track{position:absolute;left:97px;top:44px;width:228px;height:24px;}
.dp-track i{
  position:relative;display:block;height:100%;width:0;overflow:hidden;
  background-image:
    url("assets/ui/battle/progress-fill.png"),
    repeating-linear-gradient(115deg,
      rgba(255,236,180,0) 0 9px,
      rgba(255,236,180,.2) 9px 13px,
      rgba(255,236,180,0) 13px 22px);
  background-size:228px 24px, 30px 24px;
  background-repeat:no-repeat, repeat;
  background-position:left center, 0 0;
  transition:width .25s ease;
  animation:dpFillGlow 2.4s ease-in-out infinite, dpStripes 1.3s linear infinite;
}
/* 进度条流光：沿橙色填充循环扫过 */
.dp-track i::after{
  content:'';position:absolute;top:-4px;bottom:-4px;left:-46px;width:44px;
  background:linear-gradient(100deg,transparent,rgba(255,250,225,.9),transparent);
  transform:skewX(-18deg);
  animation:dpSweep 2s linear infinite;
  pointer-events:none;
}
/* 填充前缘：随进度推进的高光端点 */
.dp-track i::before{
  content:'';position:absolute;top:-2px;bottom:-2px;right:0;width:7px;
  background:linear-gradient(90deg,rgba(255,190,80,0),rgba(255,238,180,.95));
  filter:blur(1px);
  pointer-events:none;
}
.dp-text{
  /* 文案居中压在进度槽 228px 范围内，超长也不会越出进度条 */
  position:absolute;left:97px;top:11px;width:228px;height:21px;
  display:flex;align-items:center;justify-content:center;
  font-size:19px;letter-spacing:.5px;color:#fff8f5;
  text-shadow:0 2px 4px #000;white-space:nowrap;overflow:hidden;

/* 第 2 块：小地图，固定外框 225×194 @(32,149) */

/* 第 3 块：首领头像 + 血条，整组 476×133 @(134,127) */
.boss-wrap{

}

/* 头像背后的血色光晕，呼吸式明暗 */

/* 血条流光：与进度条同款但更偏血色 */
.boss-bar-track i::after{

}
/* 血条前缘：残血推进时的高光端点 */
.boss-bar-track i::before{
  content:'';position:absolute;top:-2px;bottom:-2px;right:0;width:11px;

}
.boss-hp{

}
.boss-wrap.enraged .boss-name{color:#ffd0b0;text-shadow:0 0 12px rgba(255,106,94,.55),0 2px 6px #000;}
.boss-wrap.enraged .boss-bar-track i{animation-duration:1.1s;}
.boss-wrap.enraged::before{
